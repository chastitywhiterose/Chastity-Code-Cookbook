    <text
       xml:space="preserve"
       style="font-size:11.2889px;font-family:Hack;-inkscape-font-specification:Hack;text-align:start;text-orientation:upright;text-anchor:start;fill:#ffffff;stroke-width:0.264583"
       x="223.12425"
       y="18.950655"
       id="text395"><tspan
         sodipodi:role="line"
         id="tspan393"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="18.950655">In this book, I intend to give new</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="33.061779"
         id="tspan397">programmers a quick introduction to</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="47.172905"
         id="tspan399">the C Programming Language, its history,</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="61.284031"
         id="tspan401">and how to use it for the problems it</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="75.395157"
         id="tspan409">was designed to be used for.</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="89.506279"
         id="tspan492" /><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="103.61741"
         id="tspan494">The C language refuses to die, despite</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="117.72853"
         id="tspan411">bogus claims from online trolls who are</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="131.83966"
         id="tspan419">probably not very good programmers.</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="145.95079"
         id="tspan421" /><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="160.0619"
         id="tspan423">The reason that this book is titled</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="174.17303"
         id="tspan470">&quot;C Without Printf&quot; is because it shows</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="188.28416"
         id="tspan474">how to build an input/output library</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="202.39528"
         id="tspan476">from more basic low-level functions.</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="216.50641"
         id="tspan478">Although printf is an extremely useful</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="230.61754"
         id="tspan482">function of the C Standard Library,</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="244.72867"
         id="tspan484">programmers tend to rely on it so much</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="258.83978"
         id="tspan486">that they don't learn the bits and bytes</tspan><tspan
         sodipodi:role="line"
         style="text-align:start;text-anchor:start;stroke-width:0.264583"
         x="223.12425"
         y="272.95093"
         id="tspan506">that make up computer science.</tspan></text>
